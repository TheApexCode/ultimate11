    <script>
      (function() {
        try {
          var _origFetch = window.fetch;
          var _currentFetch = function() {
            return _origFetch ? _origFetch.apply(window, arguments) : Promise.reject(new Error('Fetch unavailable'));
          };
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            }
          });
        } catch (e) {
          // If already defined or restricted
        }
      })();
    </script>
